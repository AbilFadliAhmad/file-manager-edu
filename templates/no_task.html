<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belum Ada Tugas - File Manager Edu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-2xl text-center relative overflow-hidden">
        
        <!-- Ambient Glow Effect Background -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-blue-500/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-indigo-500/30 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Animated Empty State Icon -->
        <div class="relative inline-flex items-center justify-center w-20 h-20 bg-blue-500/10 border border-blue-400/20 rounded-2xl mb-6 shadow-inner text-blue-400">
            <svg class="w-10 h-10 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
        </div>

        <!-- Header Information -->
        <h2 class="text-2xl font-bold tracking-tight text-white mb-2">
            Belum Ada Tugas Tersedia
        </h2>
        <p class="text-sm text-slate-300 leading-relaxed mb-8">
            Saat ini <span class="font-semibold text-blue-400">Pool Tugas</span> di sistem masih kosong. Silakan tunggu Guru / Admin meng-generate paket tugas baru.
        </p>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <!-- Tombol Refresh / Cek Lagi -->
            <button onclick="window.location.reload()" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:shadow-blue-500/25 transition-all duration-200 flex items-center justify-center gap-2 group active:scale-98">
                <svg class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Cek Kembali (Refresh)</span>
            </button>

            <!-- Grid Tombol Kembali & Logout -->
            <div class="gap-3">
                <a href="/logout" 
                   class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 hover:text-rose-200 border border-rose-500/20 font-medium py-2.5 px-4 rounded-xl transition-colors flex items-center justify-center gap-1.5 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Logout</span>
                </a>
            </div>
        </div>

        <!-- Footer User Tag -->
        <div class="mt-8 pt-4 border-t border-white/5 text-xs text-slate-400">
            Login sebagai: <span class="text-blue-300 font-semibold">@{{ username }}</span>
        </div>
    </div>

</body>
</html>
